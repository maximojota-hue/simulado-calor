<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulado — Calorimetria (Física, 2º ano)</title>
<style>
  :root{
    --bg:#f5f6fa;
    --card:#ffffff;
    --ink:#1a1c23;
    --muted:#6b7280;
    --line:#e3e6ee;
    --accent:#4f46e5;
    --accent-soft:#eef0ff;
    --ok:#15803d;
    --ok-soft:#e9f8ef;
    --ok-line:#b7e4c7;
    --no:#b91c1c;
    --no-soft:#fdecec;
    --no-line:#f3bcbc;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:28px 18px 80px}

  header.top{margin-bottom:22px}
  .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:clamp(22px,3.4vw,30px);line-height:1.2;margin:6px 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px;margin:0}

  .bar{
    position:sticky;top:0;z-index:5;
    background:rgba(245,246,250,.92);
    backdrop-filter:blur(8px);
    padding:12px 0 10px;margin:-4px 0 18px;
    border-bottom:1px solid var(--line);
  }
  .bar-inner{max-width:840px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px}
  .track{flex:1;height:7px;border-radius:99px;background:#e4e7f0;overflow:hidden}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .35s ease}
  .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .count b{color:var(--ink)}

  .timer{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
    padding:4px 10px;border-radius:9px;white-space:nowrap;
    background:#fff;border:1.5px solid var(--line);color:var(--ink);
  }
  .timer::before{content:"⏱ ";font-size:12.5px;opacity:.5;font-weight:400}
  .timer.warn{border-color:#efd08f;background:#fffaf0;color:#a16207}
  .timer.danger{border-color:#f3bcbc;background:var(--no-soft);color:var(--no);animation:pulse 1.5s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .timer.hidden{display:none}

  .start-rules{list-style:none;padding:0;margin:20px 0 0;display:flex;flex-direction:column;gap:10px}
  .start-rules li{font-size:14.5px;line-height:1.5;color:#3b4051;padding-left:22px;position:relative}
  .start-rules li::before{content:"›";position:absolute;left:5px;top:-1px;color:var(--accent);font-weight:800;font-size:17px}
  .big{font-size:16px;padding:15px 28px;width:100%}
  .banner{
    margin:0 0 16px;padding:11px 14px;border-radius:10px;
    background:var(--no-soft);border:1px solid var(--no-line);color:var(--no);
    font-size:14px;font-weight:600;
  }
  .meta-row{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 0;font-size:13.5px;color:var(--muted)}
  .meta-row b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* ---------- painel de registro de tentativas ---------- */
  .log{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;margin:0 0 16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .log-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .log-title{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .log-badges{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
  .badge{
    font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;
    background:#f0f2f8;color:#4b5060;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .badge.zero{opacity:.45}
  .badge.warn{background:#fff6e5;color:#a16207}
  .badge.bad{background:var(--no-soft);color:var(--no)}
  .badge.good{background:var(--ok-soft);color:var(--ok)}
  .log-toggle{
    font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;cursor:pointer;
    background:#fff;border:1px solid var(--line);color:#4b5060;font-family:inherit;
  }
  .log-toggle:hover{border-color:#c3c8f5;color:var(--accent)}
  .log-note{
    margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--no);
    background:var(--no-soft);border:1px solid var(--no-line);border-radius:9px;padding:8px 11px;
  }
  .log-note b{font-variant-numeric:tabular-nums}
  .log-list{
    list-style:none;margin:11px 0 0;padding:0;display:flex;flex-direction:column;
    gap:0;max-height:190px;overflow-y:auto;
  }
  .log-list[hidden]{display:none}
  .log-list li{
    display:flex;gap:9px;align-items:baseline;font-size:13px;line-height:1.4;
    padding:7px 0;border-bottom:1px dashed #edf0f7;color:#3b4051;
  }
  .log-list li:last-child{border-bottom:0}
  .log-time{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted);flex:0 0 auto}
  .log-tipo{font-weight:700;flex:0 0 auto}
  .log-tipo.iniciou{color:var(--accent)}
  .log-tipo.reiniciou{color:#a16207}
  .log-tipo.interrompeu{color:var(--no)}
  .log-tipo.concluiu{color:var(--ok)}
  .log-tipo.tempo{color:var(--no)}
  .log-nota{color:var(--muted);font-size:12.5px}
  .log-foot{display:flex;justify-content:flex-end;margin-top:11px}
  .log-foot[hidden]{display:none}
  .log-clear{
    font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:7px;cursor:pointer;
    background:none;border:1px solid var(--line);color:var(--muted);font-family:inherit;
  }
  .log-clear:hover{border-color:var(--no-line);color:var(--no)}

  /* ---------- confirmacao antes de revelar ---------- */
  .opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
  .opt.sel .key{background:var(--accent);color:#fff}
  .confirm{
    margin-top:16px;padding:14px 16px;border-radius:12px;
    border:1.5px dashed var(--accent);background:#f8f9ff;animation:in .18s ease;
  }
  .confirm-q{font-size:14.5px;line-height:1.5;color:#33384a;margin:0 0 12px}
  .confirm-q b{color:var(--ink)}
  .confirm-q .pick{
    display:block;margin-top:6px;font-weight:600;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  }
  .confirm-btns{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}
  .confirm-btns .btn{padding:9px 18px;font-size:14.5px}
  .danger-btn{background:var(--no);border-color:var(--no)}
  .danger-btn:hover{background:#991b1b}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:24px 24px 20px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -18px rgba(16,24,40,.18);
  }
  .chip{
    display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--accent);background:var(--accent-soft);
    padding:4px 10px;border-radius:99px;margin-bottom:14px;
  }
  .q{font-size:17.5px;line-height:1.6;margin:0 0 6px;font-weight:500}
  .q strong{font-weight:700}

  .formula{
    font-family:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
    font-size:15px;line-height:1.45;
    background:#f8f9fc;border:1px dashed #d6dae7;border-radius:10px;
    padding:14px 16px;margin:14px 0 4px;
    white-space:pre;overflow-x:auto;color:#242736;
  }
  .formula .lbl{display:block;font-family:inherit;font-size:11.5px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);margin-bottom:8px}

  /* ---------- figura (diagrama SVG da questao/aula) ---------- */
  .figura{
    margin:16px 0 4px;padding:14px 12px 10px;
    background:#fbfcff;border:1px solid var(--line);border-radius:12px;
    text-align:center;
  }
  .figura svg{max-width:100%;height:auto;display:block;margin:0 auto}
  .figura .cap{
    display:block;margin-top:9px;font-size:12.5px;line-height:1.5;
    color:var(--muted);text-align:center;
  }
  .lesson-body .figura{margin:0 0 16px}

  /* ---------- botao "aprender o assunto" ---------- */
  .lesson-btn{
    display:flex;align-items:center;gap:9px;width:100%;
    margin-top:14px;padding:12px 15px;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:#fff;border:0;border-radius:11px;cursor:pointer;
    font-family:inherit;font-size:14.5px;font-weight:700;text-align:left;
    box-shadow:0 2px 10px -3px rgba(79,70,229,.5);
    transition:transform .08s,box-shadow .15s;
  }
  .lesson-btn:hover{box-shadow:0 4px 16px -3px rgba(79,70,229,.6)}
  .lesson-btn:active{transform:scale(.994)}
  .lesson-btn .ico{
    flex:0 0 26px;height:26px;border-radius:8px;
    background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;
  }
  .lesson-btn .lbl{flex:1;min-width:0}
  .lesson-btn .lbl small{display:block;font-weight:500;opacity:.85;font-size:12px;margin-top:1px}
  .lesson-btn .arrow{opacity:.7;font-size:16px;flex:0 0 auto}

  /* ---------- modal da aula ---------- */
  .modal{
    position:fixed;inset:0;z-index:60;display:none;
    background:rgba(16,18,28,.55);backdrop-filter:blur(3px);
    padding:24px 16px;overflow-y:auto;
  }
  .modal.open{display:block;animation:fadeIn .16s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .lesson{
    max-width:720px;margin:0 auto;background:#fff;border-radius:16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.45);overflow:hidden;
    animation:up .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .lesson-head{
    padding:20px 22px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#f5f4ff,#faf9ff);
    display:flex;align-items:flex-start;gap:12px;
  }
  .lesson-head .eyebrow{
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent);font-weight:800;margin:0 0 5px;
  }
  .lesson-head h2{
    margin:0;font-size:19px;line-height:1.25;letter-spacing:-.01em;flex:1;
  }
  .lesson-close{
    flex:0 0 32px;height:32px;border-radius:9px;border:1px solid #ddd9f5;
    background:#fff;color:#5b5871;font-size:17px;cursor:pointer;line-height:1;
    display:grid;place-items:center;font-family:inherit;
  }
  .lesson-close:hover{border-color:var(--accent);color:var(--accent)}
  .lesson-body{padding:20px 22px 24px}
  .lesson-resumo{
    font-size:15px;line-height:1.6;color:#33384a;
    background:#f7f8fc;border-left:3px solid var(--accent);
    padding:12px 15px;border-radius:0 9px 9px 0;margin:0 0 20px;
  }
  .lesson-body h3{
    font-size:14px;letter-spacing:.02em;text-transform:uppercase;
    color:var(--accent);margin:24px 0 8px;font-weight:800;
  }
  .lesson-body h3:first-of-type{margin-top:0}
  .lesson-body p{font-size:15px;line-height:1.65;color:#2f3444;margin:0 0 12px}
  .lesson-body ul{margin:0 0 14px;padding-left:20px}
  .lesson-body li{font-size:15px;line-height:1.6;color:#2f3444;margin-bottom:7px}
  .lesson-form{
    font-family:"Cascadia Mono",Consolas,monospace;font-size:16px;font-weight:600;
    background:#111827;color:#e5e7eb;border-radius:10px;
    padding:14px 16px;margin:0 0 14px;text-align:center;overflow-x:auto;
  }
  .lesson-form .leg{
    display:block;font-family:inherit;font-size:11.5px;font-weight:400;
    color:#9ca3af;margin-top:7px;letter-spacing:.02em;
  }
  .lesson-hi{
    background:#eef0ff;border:1px solid #d7d9f7;border-radius:10px;
    padding:12px 14px;margin:0 0 14px;font-size:14.5px;line-height:1.55;
    color:#3b3f57;font-weight:500;
  }
  .lesson-hi::before{content:"💡 ";font-weight:400}
  .lesson-erros{
    margin:6px 0 0;padding:14px 16px;background:var(--no-soft);
    border:1px solid var(--no-line);border-radius:10px;
  }
  .lesson-erros .tit{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--no);font-weight:800;margin:0 0 8px;
  }
  .lesson-erros ul{margin:0;padding-left:18px}
  .lesson-erros li{font-size:14px;color:#7f1d1d;margin-bottom:5px;line-height:1.5}
  .lesson-foot{
    display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;
    padding:16px 22px;border-top:1px solid var(--line);background:#fbfbfe;
  }

  .opts{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:10px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;
    border:1.5px solid var(--line);border-radius:12px;
    padding:13px 15px;cursor:pointer;background:#fff;
    transition:border-color .15s,background .15s,transform .06s;
    font-size:15.5px;line-height:1.5;text-align:left;
  }
  .opt:hover:not(.locked){border-color:#c3c8f5;background:#fbfbff}
  .opt:active:not(.locked){transform:scale(.997)}
  .opt .key{
    flex:0 0 26px;height:26px;border-radius:8px;background:#f0f2f8;color:#4b5060;
    display:flex;align-items:center;justify-content:center;
    font-size:12.5px;font-weight:700;font-family:ui-monospace,monospace;
  }
  .opt .txt{flex:1}
  .opt.locked{cursor:default}
  .opt.correct{border-color:var(--ok-line);background:var(--ok-soft)}
  .opt.correct .key{background:#cdeedd;color:var(--ok)}
  .opt.wrong{border-color:var(--no-line);background:var(--no-soft)}
  .opt.wrong .key{background:#f8cfcf;color:var(--no)}
  .opt.dim{opacity:.62}
  .mark{font-weight:800;margin-left:auto;flex:0 0 auto;font-size:15px}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong .mark{color:var(--no)}

  .fb{
    margin-top:20px;border-top:1px solid var(--line);padding-top:18px;
    animation:in .22s ease;
  }
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .verdict{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;margin-bottom:10px}
  .verdict.ok{color:var(--ok)}
  .verdict.no{color:var(--no)}
  .concept{font-size:14.5px;color:#33384a;background:#f8f9fc;border-left:3px solid var(--accent);
    border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px}
  .why{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
  .why li{font-size:14.5px;line-height:1.55;padding-left:26px;position:relative;color:#3b4051}
  .why li::before{position:absolute;left:0;top:0;font-weight:800}
  .why li.good::before{content:"✓";color:var(--ok)}
  .why li.bad::before{content:"✕";color:var(--no)}
  .why li b.lbl{display:inline-block;font-family:ui-monospace,monospace;font-size:12.5px;
    background:#eef0f6;color:#40465a;border-radius:5px;padding:0 5px;margin-right:5px}
  .why li.picked{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px 8px 30px;color:var(--ink)}
  .why li.picked::before{left:10px;top:8px}

  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  button{font-family:inherit;font-size:15px;font-weight:600;border-radius:11px;cursor:pointer;transition:.15s}
  .btn{background:var(--accent);color:#fff;border:1px solid var(--accent);padding:11px 22px}
  .btn:hover{background:#4338ca}
  .btn:disabled{background:#c9ccd8;border-color:#c9ccd8;cursor:not-allowed}
  .btn.ghost{background:#fff;color:#3b4051;border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:#c3c8f5;color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted);margin-right:auto;align-self:center}

  /* resultado */
  .score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:6px 0 4px}
  .ring{
    --p:0;
    width:104px;height:104px;border-radius:50%;flex:0 0 auto;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),#e7e9f2 0);
    display:grid;place-items:center;
  }
  .ring span{width:82px;height:82px;border-radius:50%;background:#fff;display:grid;place-items:center;
    font-size:23px;font-weight:800;letter-spacing:-.02em}
  .score-txt h2{margin:0 0 4px;font-size:21px;letter-spacing:-.01em}
  .score-txt p{margin:0;color:var(--muted);font-size:14.5px}
  table{width:100%;border-collapse:collapse;margin:20px 0 4px;font-size:14.5px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
  th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  td.num{font-variant-numeric:tabular-nums;text-align:right;width:70px}
  .pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.mid{background:#fff6e5;color:#a16207}
  .pill.no{background:var(--no-soft);color:var(--no)}
  .rev-list{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
  .rev-list li{font-size:14.5px;background:#fbfbfe;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .rev-list b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:26px}
  @media (max-width:520px){
    .wrap{padding:20px 12px 60px}
    .card{padding:18px 15px 16px;border-radius:13px}
    .q{font-size:16.5px}
    .opt{font-size:15px;padding:12px 12px}
    .bar-inner{padding:0 12px}
  }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-inner">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="count" id="count"><b>1</b> / 26</div>
    <div class="timer hidden" id="timer">50:00</div>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div class="kicker">Física · Calorimetria e Termologia</div>
    <h1>Simulado de Física — Calorimetria</h1>
    <p class="sub">Montado a partir dos slides da sua aula de Calorimetria. Responda, confirme e veja o motivo do erro de cada alternativa.</p>
  </header>

  <div class="log" id="log">
    <div class="log-head">
      <span class="log-title">Registro de tentativas</span>
      <div class="log-badges" id="logBadges"></div>
      <button class="log-toggle" id="logToggle" type="button">Histórico</button>
    </div>
    <p class="log-note" id="logNote" hidden></p>
    <ul class="log-list" id="logList" hidden></ul>
    <div class="log-foot" id="logFoot" hidden>
      <button class="log-clear" id="logClear" type="button">Apagar histórico</button>
    </div>
  </div>

  <main id="stage"></main>

<div class="modal" id="modal">
  <div class="lesson" id="lesson"></div>
</div>

  <footer>Simulado gerado a partir dos slides da aula · funciona offline</footer>
</div>

<script>
/* ============================================================
   FIGURAS — diagramas de estrutura fisica em SVG embutido.
   Funcionam offline. Cores presas ao tema para ler em qualquer fundo.
   Convencao: linha = ligacao; vertice/ponta = carbono; H implicito.
   Eixos/ligacoes #4b5060, destaque #4f46e5, rotulo secundario #6b7280.
   ============================================================ */

// 2,2,4-trimetilpentano (gasolina) — Q6 e Q7


/* ============================================================
   FIGURAS - SVG embutido, offline
   ============================================================ */

const SVG_TRES_PROPAGACAO = `
<div class="figura">
<svg viewBox="0 0 420 190" role="img" aria-label="Os tres processos de propagacao de calor: conducao no solido, conveccao no fluido e radiacao atravessando o vacuo">

// de qual aula cada questao trata (na ordem do array QUESTIONS)
const LICAO_POR_QUESTAO = QUESTIONS.map(q => q.licao);

const stage   = document.getElementById('stage');
const fill    = document.getElementById('fill');
const count   = document.getElementById('count');
const timerEl = document.getElementById('timer');
const logEl   = document.getElementById('log');
const LETTERS = ['a','b','c','d','e'];

const LIMITE_SEG = 50 * 60;      // 50 minutos de prova
const K_LOG    = 'simulado_calor_log_v1';     // historico de eventos
const K_SESSAO = 'simulado_calor_sessao_v1';  // marcador de tentativa em andamento

let QUIZ = [];        // versao com alternativas embaralhadas (a que aparece na tela)
let idx = 0;
let answers = [];
let estado = 'intro'; // intro | quiz | done
let fimEm = 0, inicioEm = 0, tickId = null;
let pendente = null;  // alternativa selecionada aguardando confirmacao (-1 = pular)
let tentativa = 0;

/* ---------------- armazenamento seguro ---------------- */
const mem = {};
function lsGet(k, def){
  try { const v = localStorage.getItem(k); return v === null ? def : JSON.parse(v); }
  catch(e){ return k in mem ? mem[k] : def; }
}
function lsSet(k, v){
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ mem[k] = v; }
}
function lsDel(k){
  try { localStorage.removeItem(k); } catch(e){ delete mem[k]; }
}

/* ---------------- registro de tentativas ---------------- */
function logGet(){ const l = lsGet(K_LOG, []); return Array.isArray(l) ? l : []; }
function logAdd(tipo, nota, extra){
  const l = logGet();
  l.push(Object.assign({t: Date.now(), tipo, nota: nota || '', tentativa}, extra || {}));
  while (l.length > 60) l.shift();
  lsSet(K_LOG, l);
  renderLog();
}

function horaCurta(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function quando(ts){
  const diff = Math.round((Date.now() - ts) / 60000);
  if (diff < 1) return 'agora';
  if (diff < 60) return 'há ' + diff + ' min';
  const d = Math.round(diff / 60);
  if (d < 24) return 'há ' + d + ' h';
  return 'há ' + Math.round(d / 24) + ' d';
}

function resumoLog(){
  const l = logGet();
  const inicios   = l.filter(e => e.tipo === 'iniciou').length;
  const reinicios = l.filter(e => e.tipo === 'reiniciou').length;
  return {
    inicios,
    tentativas:  inicios + reinicios,          // toda vez que a prova recomeça, conta
    reinicios,
    interrupcoes:l.filter(e => e.tipo === 'interrompeu').length,
    conclusoes:  l.filter(e => e.tipo === 'concluiu' || e.tipo === 'tempo').length,
    ultimo:      l.length ? l[l.length - 1].t : 0
  };
}

const ROTULO = {
  iniciou:    '▶ Iniciou',
  reiniciou:  '↻ Reiniciou',
  interrompeu:'⏸ Saiu',
  concluiu:   '✓ Concluiu',
  tempo:      '⏱ Tempo esgotado'
};

function renderLog(){
  const r = resumoLog();
  const badges = document.getElementById('logBadges');
  const note   = document.getElementById('logNote');
  const list   = document.getElementById('logList');
  const foot   = document.getElementById('logFoot');
  if (!badges) return;

  const b = [];
  b.push(`<span class="badge ${r.tentativas?'':'zero'}">Tentativas: ${r.tentativas}</span>`);
  b.push(`<span class="badge ${r.reinicios?'warn':'zero'}">Reinícios: ${r.reinicios}</span>`);
  b.push(`<span class="badge ${r.interrupcoes?'bad':'zero'}">Saídas no meio: ${r.interrupcoes}</span>`);
  b.push(`<span class="badge ${r.conclusoes?'good':'zero'}">Concluídas: ${r.conclusoes}</span>`);
  if (r.ultimo) b.push(`<span class="badge zero">última: ${quando(r.ultimo)}</span>`);
  badges.innerHTML = b.join('');

  const total = r.reinicios + r.interrupcoes;
  if (total > 0){
    note.hidden = false;
    note.innerHTML = `Este simulado já foi <b>reiniciado ${r.reinicios}×</b> e <b>interrompido ${r.interrupcoes}×</b> ` +
      `(sair ou recarregar a página no meio conta como interrupção). O registro fica salvo neste navegador.`;
  } else {
    note.hidden = true;
  }

  const l = logGet().slice().reverse();
  list.innerHTML = l.map(e => `
    <li>
      <span class="log-time">${horaCurta(e.t)}</span>
      <span class="log-tipo ${e.tipo}">${ROTULO[e.tipo] || e.tipo}</span>
      <span class="log-nota">${e.nota || ''}</span>
    </li>`).join('');
  foot.hidden = !l.length;
}

/* ---------------- sessao em andamento ---------------- */
function marcarSessao(){
  lsSet(K_SESSAO, {
    inicio: inicioEm, tentativa,
    idx: idx + 1,
    respondidas: answers.length,
    total: QUESTIONS.length,
    naTela: Date.now()
  });
}
function limparSessao(){ lsDel(K_SESSAO); }

// ao abrir a pagina: se havia tentativa em andamento, isso conta como interrupcao
function registrarSaidaAnterior(){
  const s = lsGet(K_SESSAO, null);
  if (!s) return false;
  tentativa = s.tentativa || 1;
  logAdd('interrompeu',
    `tentativa ${s.tentativa} parada na questão ${s.idx}/${s.total} (${s.respondidas} respondida(s))`,
    {t: s.naTela || s.inicio});
  limparSessao();
  return true;
}

/* ---------------- embaralhamento equilibrado ---------------- */
function shuffleArr(a){
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--){
    const k = Math.floor(Math.random() * (i + 1));
    [r[i], r[k]] = [r[k], r[i]];
  }
  return r;
}

function montarQuiz(){
  const n = QUESTIONS.length;
  const cota = Math.floor(n / 5);
  const sobra = n % 5;
  const letras = shuffleArr([0,1,2,3,4]).slice(0, sobra);
  let pool = [];
  for (let l = 0; l < 5; l++){
    const qtd = cota + (letras.includes(l) ? 1 : 0);
    for (let k = 0; k < qtd; k++) pool.push(l);
  }
  pool = shuffleArr(pool);

  return QUESTIONS.map((q, qi) => {
    const correta = q.alternativas.findIndex(a => a.ok);
    const erradas = shuffleArr(q.alternativas.map((_, k) => k).filter(k => k !== correta));
    const alvo = pool[qi];
    const ordem = [];
    let pe = 0;
    for (let pos = 0; pos < q.alternativas.length; pos++){
      ordem.push(pos === alvo ? correta : erradas[pe++]);
    }
    return {
      tema: q.tema,
      enunciado: q.enunciado,
      figura: q.figura,                     // diagrama SVG (sobrevive ao sorteio)
      estrutura: q.estrutura,
      conceito: q.conceito,
      licao: q.licao,                       // aula do assunto (sobrevive ao sorteio)
      alternativas: ordem.map(k => q.alternativas[k])
    };
  });
}

/* ---------------- cronometro ---------------- */
function fmt(seg){
  seg = Math.max(0, Math.round(seg));
  return String(Math.floor(seg / 60)).padStart(2,'0') + ':' + String(seg % 60).padStart(2,'0');
}
function restanteSeg(){ return (fimEm - Date.now()) / 1000; }

function tick(){
  if (estado !== 'quiz') return;
  const seg = restanteSeg();
  timerEl.textContent = fmt(seg);
  timerEl.classList.toggle('warn',   seg <= 600 && seg > 300);
  timerEl.classList.toggle('danger', seg <= 300);
  if (seg <= 0) encerrarPorTempo();
}
function iniciarTimer(){
  inicioEm = Date.now();
  fimEm = inicioEm + LIMITE_SEG * 1000;
  timerEl.classList.remove('hidden','warn','danger');
  timerEl.textContent = fmt(LIMITE_SEG);
  clearInterval(tickId);
  tickId = setInterval(tick, 250);
  tick();
}
function pararTimer(){ clearInterval(tickId); tickId = null; timerEl.classList.add('hidden'); }

/* ---------------- telas ---------------- */
function progress(){
  const pct = (idx / QUESTIONS.length) * 100;
  fill.style.width = pct + '%';
  count.innerHTML = '<b>' + Math.min(idx + 1, QUESTIONS.length) + '</b> / ' + QUESTIONS.length;
}

function telaInicial(){
  estado = 'intro';
  pararTimer();
  pendente = null;
  fill.style.width = '0%';
  count.innerHTML = '<b>' + QUESTIONS.length + '</b> questões';
  renderLog();

  const r = resumoLog();
  const aviso = (r.reinicios + r.interrupcoes) > 0
    ? `<p class="log-note" style="margin-top:16px">Atenção: este simulado já foi reiniciado <b>${r.reinicios}×</b> e interrompido <b>${r.interrupcoes}×</b>. Esse histórico aparece no topo durante toda a prova.</p>`
    : '';

  stage.innerHTML = `
    <section class="card">
      <span class="chip">Antes de começar</span>
      <p class="q">Simulado de Física (Calorimetria) — <strong>${QUESTIONS.length} questões</strong>, <strong>50 minutos</strong> de prova.</p>
      <ul class="start-rules">
        <li>O cronômetro começa em <b>Iniciar simulado</b> e não pausa.</li>
        <li>Cada resposta pede <b>confirmação</b> antes de revelar o gabarito.</li>
        <li>Se você sair ou recarregar no meio, isso é <b>registrado</b> no painel de tentativas lá em cima.</li>
        <li>As alternativas são sorteadas a cada tentativa — a letra correta muda de lugar.</li>
        <li>Ao chegar em 00:00, o simulado é encerrado e corrigido com o que você já respondeu.</li>
      </ul>
      ${aviso}
      <div class="actions">
        <span class="hint">Enter também inicia</span>
        <button class="btn ghost" id="semTimer" type="button">Treinar sem tempo</button>
        <button class="btn" id="iniciar" type="button">Iniciar simulado</button>
      </div>
    </section>`;
  document.getElementById('iniciar').addEventListener('click', () => comecar(true));
  document.getElementById('semTimer').addEventListener('click', () => comecar(false));
}

function comecar(comTempo, motivo){
  QUIZ = montarQuiz();
  idx = 0;
  answers = [];
  pendente = null;
  estado = 'quiz';
  tentativa = resumoLog().tentativas + 1;
  if (comTempo) iniciarTimer(); else { inicioEm = Date.now(); pararTimer(); }

  logAdd(motivo === 'reiniciou' ? 'reiniciou' : 'iniciou',
         motivo === 'reiniciou'
           ? `tentativa ${tentativa} — recomeçou do zero${comTempo ? ' com 50 min' : ' sem tempo'}`
           : `tentativa ${tentativa} — ${comTempo ? '50 minutos' : 'sem tempo'}`);
  marcarSessao();
  renderQuestion();
}

function renderQuestion(){
  const q = QUIZ[idx];
  progress();
  pendente = null;

  const opts = q.alternativas.map((a, i) => `
      <button class="opt" data-i="${i}" type="button">
        <span class="key">${LETTERS[i]}</span>
        <span class="txt">${a.t}</span>
      </button>`).join('');

  stage.innerHTML = `
    <section class="card">
      <span class="chip">${q.tema}</span>
      <p class="q">${q.enunciado}</p>
      ${q.figura ? q.figura : ''}
      ${q.estrutura ? `<div class="formula"><span class="lbl">estrutura</span>${q.estrutura}</div>` : ''}
      <div class="opts" id="opts">${opts}</div>
      <div id="confirmBox"></div>
      <div id="fb"></div>
      <div class="actions">
        <span class="hint" id="hint">Escolha uma alternativa (teclas 1–5)</span>
        <button class="btn ghost" id="restart" type="button">Reiniciar</button>
        <button class="btn ghost" id="skip" type="button">Pular</button>
        <button class="btn" id="next" type="button" disabled>Próxima</button>
      </div>
    </section>`;

  document.getElementById('opts').addEventListener('click', e => {
    const b = e.target.closest('.opt');
    if (b && !b.classList.contains('locked')) selecionar(parseInt(b.dataset.i, 10));
  });
  document.getElementById('next').addEventListener('click', next);
  document.getElementById('skip').addEventListener('click', pedirPular);
  document.getElementById('restart').addEventListener('click', pedirReinicio);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---- etapa 1: selecionar (nao revela nada) ---- */
function selecionar(i){
  const q = QUIZ[idx];
  const fb = document.getElementById('fb');
  if (estado !== 'quiz' || (fb && fb.dataset.done)) return;
  if (i < 0 || i >= q.alternativas.length) return;

  pendente = i;

  document.querySelectorAll('.opt').forEach(el => {
    el.classList.toggle('sel', parseInt(el.dataset.i, 10) === i);
  });

  const box = document.getElementById('confirmBox');
  box.innerHTML = `
    <div class="confirm">
      <p class="confirm-q">
        Confirmar esta resposta?
        <span class="pick"><b>${LETTERS[i]})</b> ${q.alternativas[i].t}</span>
      </p>
      <div class="confirm-btns">
        <button class="btn ghost" id="trocar" type="button">Trocar</button>
        <button class="btn" id="confirmar" type="button">Confirmar resposta</button>
      </div>
    </div>`;
  document.getElementById('confirmar').addEventListener('click', confirmar);
  document.getElementById('trocar').addEventListener('click', limparSelecao);
  document.getElementById('hint').textContent = 'Confirme para ver o gabarito (Enter confirma)';
  document.getElementById('confirmar').focus({preventScroll:true});
}

function limparSelecao(){
  pendente = null;
  document.querySelectorAll('.opt').forEach(el => el.classList.remove('sel'));
  const box = document.getElementById('confirmBox');
  if (box) box.innerHTML = '';
  const hint = document.getElementById('hint');
  if (hint) hint.textContent = 'Escolha uma alternativa (teclas 1–5)';
}

function confirmar(){
  if (pendente === null) return;
  const escolha = pendente;
  document.getElementById('confirmBox').innerHTML = '';
  revelar(escolha);
}

/* ---- pular tambem passa por confirmacao ---- */
function pedirPular(){
  const fb = document.getElementById('fb');
  if (estado !== 'quiz' || (fb && fb.dataset.done)) return;
  pendente = -1;
  document.querySelectorAll('.opt').forEach(el => el.classList.remove('sel'));
  const box = document.getElementById('confirmBox');
  box.innerHTML = `
    <div class="confirm">
      <p class="confirm-q">
        Pular esta questão? Ela entra como <b>não respondida</b> no resultado.
      </p>
      <div class="confirm-btns">
        <button class="btn ghost" id="trocar" type="button">Voltar</button>
        <button class="btn danger-btn" id="confirmar" type="button">Pular mesmo assim</button>
      </div>
    </div>`;
  document.getElementById('confirmar').addEventListener('click', confirmar);
  document.getElementById('trocar').addEventListener('click', limparSelecao);
  document.getElementById('confirmar').focus({preventScroll:true});
}

/* ---- reinicio com confirmacao e registro ---- */
function pedirReinicio(){
  if (estado !== 'quiz') return;
  boxReinicio();
}

function boxReinicio(){
  const box = document.getElementById('confirmBox');
  const resp = answers.length;
  box.innerHTML = `
    <div class="confirm" style="border-color:var(--no-line);background:var(--no-soft)">
      <p class="confirm-q">
        Reiniciar o simulado? Você está na <b>questão ${idx + 1} de ${QUESTIONS.length}</b> com
        <b>${resp} resposta(s)</b> registrada(s). Tudo é apagado e o reinício fica marcado no
        painel de registro do topo.
      </p>
      <div class="confirm-btns">
        <button class="btn ghost" id="trocar" type="button">Cancelar</button>
        <button class="btn danger-btn" id="confirmar" type="button">Sim, reiniciar</button>
      </div>
    </div>`;
  document.getElementById('confirmar').addEventListener('click', () => {
    comecar(true, 'reiniciou');
  });
  document.getElementById('trocar').addEventListener('click', () => {
    if (pendente === null) limparSelecao(); else selecionar(pendente);
  });
  document.getElementById('confirmar').focus({preventScroll:true});
}

/* ---- etapa 2: revelar gabarito ---- */
function revelar(chosen){
  if (estado !== 'quiz') return;
  const q = QUIZ[idx];
  const fb = document.getElementById('fb');
  if (fb.dataset.done) return;
  fb.dataset.done = '1';

  const ok = chosen >= 0 && q.alternativas[chosen].ok;
  answers.push({i: idx, chosen, ok, tema: q.tema});
  pendente = null;
  marcarSessao();

  document.querySelectorAll('.opt').forEach(el => {
    const i = parseInt(el.dataset.i, 10);
    const a = q.alternativas[i];
    el.classList.remove('sel');
    el.classList.add('locked');
    if (a.ok){
      el.classList.add('correct');
      el.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>');
    } else if (i === chosen){
      el.classList.add('wrong');
      el.insertAdjacentHTML('beforeend', '<span class="mark">✕</span>');
    } else {
      el.classList.add('dim');
    }
  });

  const why = q.alternativas.map((a, i) => {
    const cls = a.ok ? 'good' : 'bad';
    const picked = i === chosen ? ' picked' : '';
    return `<li class="${cls}${picked}"><b class="lbl">${LETTERS[i]}</b>${a.porque}</li>`;
  }).join('');

  const verdict = chosen === -1
    ? `<div class="verdict no">⏭ Você pulou esta questão</div>`
    : ok
      ? `<div class="verdict ok">✓ Resposta correta</div>`
      : `<div class="verdict no">✕ Resposta incorreta — a correta é a letra ${LETTERS[q.alternativas.findIndex(a => a.ok)]}</div>`;

  const lic = LICOES[q.licao];
  const btnAula = lic ? `
    <button class="lesson-btn" id="abrirAula" type="button">
      <span class="ico">📘</span>
      <span class="lbl">Aprender o assunto do zero
        <small>${lic.titulo}</small></span>
      <span class="arrow">→</span>
    </button>` : '';

  fb.innerHTML = `
    <div class="fb">
      ${verdict}
      <p class="concept">${q.conceito}</p>
      <ul class="why">${why}</ul>
      ${btnAula}
    </div>`;

  const abrir = document.getElementById('abrirAula');
  if (abrir) abrir.addEventListener('click', () => abrirLicao(q.licao));

  const nextBtn = document.getElementById('next');
  nextBtn.disabled = false;
  nextBtn.textContent = (idx === QUESTIONS.length - 1) ? 'Ver resultado' : 'Próxima';
  document.getElementById('skip').style.display = 'none';
  document.getElementById('hint').textContent = ok ? 'Boa. Enter para continuar.' : 'Leia as explicações e siga com Enter.';
  nextBtn.focus({preventScroll:true});
}

function next(){
  const fb = document.getElementById('fb');
  if (!fb || !fb.dataset.done) return;
  idx++;
  if (idx >= QUESTIONS.length) return results();
  marcarSessao();
  renderQuestion();
}

function encerrarPorTempo(){
  pararTimer();
  results(true);
}

function results(porTempo){
  estado = 'done';
  pararTimer();
  limparSessao();

  const segUsados = porTempo ? LIMITE_SEG : Math.min(LIMITE_SEG, Math.round((Date.now() - inicioEm) / 1000));
  fill.style.width = '100%';

  const right = answers.filter(a => a.ok).length;
  const total = QUESTIONS.length;
  const pct = Math.round((right / total) * 100);
  const semResposta = total - answers.length;

  logAdd(porTempo ? 'tempo' : 'concluiu',
         `tentativa ${tentativa} — ${right}/${total} (${pct}%) em ${fmt(segUsados)}`);

  const byTheme = {};
  answers.forEach(a => {
    byTheme[a.tema] = byTheme[a.tema] || {t:0, ok:0};
    byTheme[a.tema].t++;
    if (a.ok) byTheme[a.tema].ok++;
  });

  const rows = Object.entries(byTheme).map(([tema, v]) => {
    const p = Math.round((v.ok / v.t) * 100);
    const cls = p >= 80 ? 'ok' : p >= 50 ? 'mid' : 'no';
    return `<tr><td>${tema}</td><td class="num">${v.ok}/${v.t}</td>
            <td class="num"><span class="pill ${cls}">${p}%</span></td></tr>`;
  }).join('');

  const errors = answers.filter(a => !a.ok);
  const rev = errors.length
    ? `<ul class="rev-list">${errors.map(a => {
        const q = QUIZ[a.i];
        const corr = q.alternativas.find(x => x.ok);
        return `<li><b>Questão ${a.i + 1} · ${q.tema}</b>
                  ${a.chosen === -1 ? 'Você pulou. ' : ''}Correta (${LETTERS[q.alternativas.findIndex(x => x.ok)]}): ${corr.t}</li>`;
      }).join('')}</ul>`
    : `<p class="sub" style="margin-top:18px">Nenhum erro. Nesse nível, vale revisar só os detalhes de nomenclatura de radicais (sec-, terc-, iso-) antes da prova.</p>`;

  const msg = pct >= 85 ? 'Muito bom — você domina a classificação de cadeias.'
            : pct >= 65 ? 'Bom caminho. Os erros estão concentrados em poucos temas: releia a tabela.'
            : pct >= 45 ? 'Base em construção. Refaça as questões erradas com a explicação ao lado.'
            : 'Vale voltar à teoria: tetravalência, classificação de carbonos e os três critérios de cadeia.';

  const rr = resumoLog();
  count.innerHTML = '<b>' + total + '</b> / ' + total;

  stage.innerHTML = `
    <section class="card">
      <span class="chip">Resultado</span>
      ${porTempo ? `<div class="banner">⏱ Tempo esgotado — o simulado foi encerrado e corrigido com as respostas já registradas.</div>` : ''}
      <div class="score">
        <div class="ring" style="--p:${pct}"><span>${pct}%</span></div>
        <div class="score-txt">
          <h2>${right} de ${total} corretas</h2>
          <p>${msg}</p>
        </div>
      </div>
      <div class="meta-row">
        <span>Tentativa: <b>${tentativa}ª</b></span>
        <span>Tempo: <b>${fmt(segUsados)}</b>${porTempo ? ' (limite)' : ' de 50:00'}</span>
        <span>Em branco: <b>${semResposta}</b></span>
        <span>Média por questão: <b>${answers.length >= 3 ? fmt(segUsados / answers.length) : '—'}</b></span>
        <span>Reinícios + saídas: <b>${rr.reinicios + rr.interrupcoes}</b></span>
      </div>
      <table>
        <thead><tr><th>Tema</th><th class="num">Acertos</th><th class="num">%</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <h3 style="font-size:15px;margin:22px 0 0">Revisar antes da prova</h3>
      ${rev}
      <div class="actions">
        <span class="hint">Cada tentativa sorteia novas posições.</span>
        <button class="btn ghost" id="inicio" type="button">Tela inicial</button>
        <button class="btn" id="again" type="button">Refazer o simulado</button>
      </div>
    </section>`;

  document.getElementById('again').addEventListener('click', () => comecar(true, 'reiniciou'));
  document.getElementById('inicio').addEventListener('click', telaInicial);
  renderLog();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------------- painel de registro ---------------- */
document.getElementById('logToggle').addEventListener('click', () => {
  const list = document.getElementById('logList');
  const foot = document.getElementById('logFoot');
  const abrir = list.hidden;
  list.hidden = !abrir;
  foot.hidden = !abrir || !logGet().length;
  document.getElementById('logToggle').textContent = abrir ? 'Ocultar' : 'Histórico';
});

document.getElementById('logClear').addEventListener('click', () => {
  lsSet(K_LOG, []);
  renderLog();
  const list = document.getElementById('logList');
  list.hidden = true;
  document.getElementById('logFoot').hidden = true;
  document.getElementById('logToggle').textContent = 'Histórico';
});

/* ---------------- aula do assunto (modal) ---------------- */
let scrollAntes = 0;

function renderLicao(id){
  const l = LICOES[id];
  if (!l) return '';

  const corpo = l.blocos.map(b => {
    if (b.t === 'h')   return `<h3>${b.v}</h3>`;
    if (b.t === 'p')   return `<p>${b.v}</p>`;
    if (b.t === 'formula') return `<div class="lesson-form">${b.v}${b.leg ? `<span class="leg">${b.leg}</span>` : ''}</div>`;
    if (b.t === 'figura') return b.v;
    if (b.t === 'destaque') return `<div class="lesson-hi">${b.v}</div>`;
    if (b.t === 'lista') return `<ul>${b.v.map(x => `<li>${x}</li>`).join('')}</ul>`;
    return '';
  }).join('');

  const erros = (l.erros && l.erros.length) ? `
    <div class="lesson-erros">
      <p class="tit">Onde todo mundo erra</p>
      <ul>${l.erros.map(x => `<li>${x}</li>`).join('')}</ul>
    </div>` : '';

  return `
    <div class="lesson-head">
      <div style="flex:1;min-width:0">
        <p class="eyebrow">Aula · Calorimetria</p>
        <h2>${l.titulo}</h2>
      </div>
      <button class="lesson-close" id="fecharAula" type="button" aria-label="Fechar">✕</button>
    </div>
    <div class="lesson-body">
      <p class="lesson-resumo">${l.resumo}</p>
      ${corpo}
      ${erros}
    </div>
    <div class="lesson-foot">
      <button class="btn ghost" id="fecharAula2" type="button">Voltar para a questão</button>
      <button class="btn" id="entendi" type="button">Entendi, continuar</button>
    </div>`;
}

function abrirLicao(id){
  const modal = document.getElementById('modal');
  const box   = document.getElementById('lesson');
  if (!modal || !LICOES[id]) return;
  scrollAntes = window.scrollY;
  box.innerHTML = renderLicao(id);
  modal.classList.add('open');
  modal.scrollTop = 0;
  document.body.style.overflow = 'hidden';
  document.getElementById('fecharAula').addEventListener('click', fecharLicao);
  document.getElementById('fecharAula2').addEventListener('click', fecharLicao);
  document.getElementById('entendi').addEventListener('click', fecharLicao);
}

function fecharLicao(){
  const modal = document.getElementById('modal');
  if (!modal) return;
  modal.classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('lesson').innerHTML = '';
  window.scrollTo({top: scrollAntes, behavior: 'auto'});
  const n = document.getElementById('next');
  if (n) n.focus({preventScroll:true});
}

document.addEventListener('click', e => {
  if (e.target && e.target.id === 'modal') fecharLicao();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    const m = document.getElementById('modal');
    if (m && m.classList.contains('open')){ e.preventDefault(); e.stopPropagation(); fecharLicao(); }
  }
}, true);

/* ---------------- teclado ---------------- */
document.addEventListener('keydown', e => {
  const modalAberto = document.getElementById('modal') && document.getElementById('modal').classList.contains('open');
  if (modalAberto) return;              // aula aberta: teclado do quiz fica inativo
  if (estado === 'intro'){
    if (e.key === 'Enter'){ e.preventDefault(); comecar(true); }
    return;
  }
  if (estado !== 'quiz') return;
  const fb = document.getElementById('fb');
  if (!fb) return;

  if (fb.dataset.done){
    if (e.key === 'Enter'){ e.preventDefault(); next(); }
    return;
  }
  if (/^[1-5]$/.test(e.key)){
    const i = parseInt(e.key, 10) - 1;
    if (i < QUIZ[idx].alternativas.length){ e.preventDefault(); selecionar(i); }
    return;
  }
  if (e.key === 'Enter' && pendente !== null){ e.preventDefault(); confirmar(); }
  if (e.key === 'Escape' && pendente !== null){ e.preventDefault(); limparSelecao(); }
});

/* ---------------- ao sair no meio da tentativa ---------------- */
window.addEventListener('pagehide', () => { if (estado === 'quiz') marcarSessao(); });
window.addEventListener('beforeunload', () => { if (estado === 'quiz') marcarSessao(); });

/* ---------------- boot ---------------- */
registrarSaidaAnterior();
renderLog();
telaInicial();
</script>
